name: "CI: Unit Test Coverage"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') && !contains(github.ref, 'develop') }}

jobs:
  coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install F Prime tools
        run: |
          python -m pip install --upgrade pip
          if [ ! -f "lib/fprime/requirements.txt" ]; then
            echo "Cloning F Prime into lib/fprime"
            rm -rf lib/fprime
            git clone --depth 1 https://github.com/nasa/fprime.git lib/fprime
          fi
          if [ ! -f "lib/fprime/requirements.txt" ]; then
            echo "Missing lib/fprime/requirements.txt after clone."
            exit 1
          fi
          pip install -r lib/fprime/requirements.txt
          pip install fprime-tools fprime-gds

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          COMPONENT_DIRS="$(find . -path "*/test/ut/CMakeLists.txt" -print | sed 's|/test/ut/CMakeLists.txt||' | sort -u)"
          if [ -z "$COMPONENT_DIRS" ]; then
            echo "No unit test directories found (expected */test/ut/CMakeLists.txt)."
            exit 1
          fi
          while IFS= read -r dir; do
            echo "Running coverage in ${dir}"
            (cd "${dir}" && fprime-util generate --ut && fprime-util check --all --coverage)
          done <<< "$COMPONENT_DIRS"
