name: "CI: Build and Unit Tests"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') && !contains(github.ref, 'develop') }}

jobs:
  build_and_test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install F Prime tools
        run: |
          python -m pip install --upgrade pip
          if [ ! -f "lib/fprime/requirements.txt" ]; then
            echo "Missing lib/fprime/requirements.txt. Ensure submodules are initialized."
            exit 1
          fi
          pip install -r lib/fprime/requirements.txt
          pip install fprime-tools fprime-gds pre-commit cpplint

      - name: Generate and build
        run: |
          set -euo pipefail
          fprime-util generate
          fprime-util build

      - name: Run unit tests (if any exist)
        run: |
          set -euo pipefail
          COMPONENT_DIRS="$(find . -path "*/test/ut/CMakeLists.txt" -print | sed 's|/test/ut/CMakeLists.txt||' | sort -u)"
          if [ -z "$COMPONENT_DIRS" ]; then
            echo "No unit test directories found. Skipping."
            exit 0
          fi
          while IFS= read -r dir; do
            echo "Running unit tests in ${dir}"
            (cd "${dir}" && fprime-util generate --ut && fprime-util check --all)
          done <<< "$COMPONENT_DIRS"
