name: "PR: Auto Label"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from config
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
